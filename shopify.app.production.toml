# Production configuration for Cartovum Bulk Product Manager.
# Select it with "npm run config:use shopify.app.production.toml", then "npm run deploy".
# The domain below is the planned production URL; it must be live (HTTPS, this app running)
# before deploying this configuration, and SHOPIFY_APP_URL on the server must match it.
client_id = "23cb842307346f58ce89b3a780536e31"
name = "Cartovum Bulk Product Manager"
application_url = "https://app.cartovumagency.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# Minimum scopes; write scopes include read access. See ACCESS_SCOPES.md.
scopes = "write_products,write_inventory"

[auth]
redirect_urls = ["https://app.cartovumagency.com/auth/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for App Store apps.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
