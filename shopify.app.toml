# Development configuration for Cartovum Bulk Product Manager.
# Link it to the app that already exists in your Dev Dashboard with "npm run config:link"
# (fills client_id; client_id is not a secret). During "npm run dev" the Shopify CLI replaces
# application_url and redirect_urls with its tunnel URL, so the values below are placeholders.
# Production uses shopify.app.production.toml (see README, "Production").
client_id = "23cb842307346f58ce89b3a780536e31"
name = "Cartovum Bulk Product Manager"
application_url = "https://localhost"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Minimum scopes; write scopes include read access. See ACCESS_SCOPES.md.
scopes = "write_products,write_inventory"

[auth]
redirect_urls = ["https://localhost/auth/callback"]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Mandatory compliance topics for App Store apps.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
